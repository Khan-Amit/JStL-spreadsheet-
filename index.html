<!DOCTYPE html>
<html>
<head>
    <title>JStL Spreadsheet™</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background: #0a0a2e; padding: 20px; }
        .box { max-width: 800px; margin: auto; background: white; border-radius: 20px; padding: 20px; }
        .green { background: #1B5E20; color: white; padding: 20px; text-align: center; border-radius: 10px; }
        button { background: #1B5E20; color: white; padding: 10px 20px; margin: 5px; border: none; border-radius: 20px; cursor: pointer; }
        .card { background: #f5f5f5; padding: 15px; margin: 15px 0; border-radius: 10px; }
        input { width: 100%; padding: 8px; margin: 5px 0; }
        .result { background: #e8f5e9; padding: 10px; text-align: center; }
    </style>
</head>
<body>
<div class="box">
    <div class="green">
        <h1>📊 JStL Spreadsheet™</h1>
        <p>Installable App | No Excel | No Google</p>
    </div>
    
    <div style="text-align:center; margin:15px 0">
        <button onclick="selectCountry('bangladesh')">🇧🇩 Bangladesh</button>
        <button onclick="selectCountry('canada')">🇨🇦 Canada</button>
        <button onclick="selectCountry('india')">🇮🇳 India</button>
        <button onclick="selectCountry('thailand')">🇹🇭 Thailand</button>
    </div>
    
    <div class="card">
        <h3>💰 Profit Demo</h3>
        <input type="number" id="buy" value="500" placeholder="Buy Price" oninput="calcProfit()">
        <input type="number" id="sell" value="750" placeholder="Sell Price" oninput="calcProfit()">
        <input type="number" id="qty" value="100" placeholder="Quantity" oninput="calcProfit()">
        <div class="result">Profit: <span id="profit">25000</span> <span id="curr1">BDT</span></div>
    </div>
    
    <div class="card">
        <h3>📊 Tax Demo</h3>
        <input type="number" id="income" value="1000000" placeholder="Annual Income" oninput="calcTax()">
        <div class="result">Tax: <span id="tax">25000</span> <span id="curr2">BDT</span></div>
    </div>
    
    <div class="card">
        <h3>👥 Demography Demo</h3>
        <input type="number" id="pop" value="171186000" placeholder="Population" oninput="calcDemo()">
        <input type="number" id="birth" value="17.8" placeholder="Birth Rate" oninput="calcDemo()">
        <input type="number" id="death" value="5.5" placeholder="Death Rate" oninput="calcDemo()">
        <div class="result">Growth: <span id="growth">1.23</span>%</div>
    </div>
    
    <div style="text-align:center">
        <button onclick="downloadPage()">📥 Download HTML</button>
        <button onclick="alert('Email seliim.ahmed@gmail.com')">💎 Buy $199</button>
    </div>
    
    <div style="text-align:center; margin-top:20px; font-size:12px; color:#666;">
        © Seliim Ahmed | seliim.ahmed@gmail.com
    </div>
</div>

<script>
    const data = {
        bangladesh: { curr: "BDT", pop: 171186000, birth: 17.8, death: 5.5 },
        canada: { curr: "CAD", pop: 38929000, birth: 9.8, death: 8.3 },
        india: { curr: "INR", pop: 1441710000, birth: 16.1, death: 6.6 },
        thailand: { curr: "THB", pop: 71801000, birth: 10.0, death: 8.0 }
    };
    let country = "bangladesh";
    
    function selectCountry(c) {
        country = c;
        let d = data[c];
        document.getElementById('pop').value = d.pop;
        document.getElementById('birth').value = d.birth;
        document.getElementById('death').value = d.death;
        document.getElementById('curr1').innerText = d.curr;
        document.getElementById('curr2').innerText = d.curr;
        calcProfit();
        calcTax();
        calcDemo();
    }
    
    function calcProfit() {
        let buy = parseFloat(document.getElementById('buy').value) || 0;
        let sell = parseFloat(document.getElementById('sell').value) || 0;
        let qty = parseFloat(document.getElementById('qty').value) || 0;
        let profit = (sell - buy) * qty;
        document.getElementById('profit').innerText = profit.toLocaleString();
    }
    
    function calcTax() {
        let income = parseFloat(document.getElementById('income').value) || 0;
        let tax = 0;
        if(income > 350000) {
            let taxable = income - 350000;
            if(taxable > 0) tax += Math.min(taxable, 100000) * 0.05;
            if(taxable > 100000) tax += Math.min(taxable-100000, 400000) * 0.10;
            if(taxable > 500000) tax += Math.min(taxable-500000, 500000) * 0.15;
            if(taxable > 1000000) tax += Math.min(taxable-1000000, 500000) * 0.20;
            if(taxable > 1500000) tax += Math.min(taxable-1500000, 2000000) * 0.25;
            if(taxable > 3500000) tax += (taxable-3500000) * 0.30;
        }
        document.getElementById('tax').innerText = Math.round(tax).toLocaleString();
    }
    
    function calcDemo() {
        let pop = parseFloat(document.getElementById('pop').value) || 0;
        let birth = parseFloat(document.getElementById('birth').value) || 0;
        let death = parseFloat(document.getElementById('death').value) || 0;
        let growth = (birth - death) / 10;
        document.getElementById('growth').innerText = growth.toFixed(2);
    }
    
    function downloadPage() {
        let html = document.documentElement.outerHTML;
        let blob = new Blob([html], {type: 'text/html'});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'jstl.html';
        a.click();
    }
    
    selectCountry('bangladesh');
</script>
</body>
</html>
