<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JStL Spreadsheet™</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a2e;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
        }
        .header {
            background: #1B5E20;
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; }
        .country-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .country-btn {
            background: #1B5E20;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        .country-btn:hover { background: #FF6B35; }
        .content { padding: 20px; }
        .card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .download-btn {
            background: #FF6B35;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
        }
        .footer {
            background: #1a1a2e;
            color: #aaa;
            padding: 20px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .country-buttons { flex-direction: column; }
            .country-btn { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 JStL Spreadsheet™</h1>
        <p>Installable App | No Excel | No Google</p>
    </div>
    
    <div class="country-buttons">
        <button class="country-btn" onclick="showData('bangladesh')">🇧🇩 Bangladesh</button>
        <button class="country-btn" onclick="showData('canada')">🇨🇦 Canada</button>
        <button class="country-btn" onclick="showData('india')">🇮🇳 India</button>
        <button class="country-btn" onclick="showData('thailand')">🇹🇭 Thailand</button>
    </div>
    
    <div class="content">
        <div class="card">
            <h3>📊 Demography Data</h3>
            <p><strong>Population:</strong> <span id="pop">171,186,000</span></p>
            <p><strong>Birth Rate:</strong> <span id="birth">17.8</span> /1k</p>
            <p><strong>Death Rate:</strong> <span id="death">5.5</span> /1k</p>
            <p><strong>Growth Rate:</strong> <span id="growth">1.23</span>%</p>
        </div>
        
        <div class="card">
            <h3>💰 Finance Data</h3>
            <p><strong>Currency:</strong> <span id="currency">BDT</span></p>
            <p><strong>VAT Rate:</strong> <span id="vat">15</span>%</p>
            <p><strong>Income Tax:</strong> <span id="tax">8</span>%</p>
        </div>
        
        <button class="download-btn" onclick="downloadSoftware()">📥 Download JStL Spreadsheet</button>
    </div>
    
    <div class="footer">
        <p>JStL Spreadsheet™ | seliim.ahmed@gmail.com | $199</p>
    </div>
</div>

<script>
    const data = {
        bangladesh: { pop: "171,186,000", birth: "17.8", death: "5.5", growth: "1.23", currency: "BDT", vat: "15", tax: "8" },
        canada: { pop: "38,929,000", birth: "9.8", death: "8.3", growth: "0.15", currency: "CAD", vat: "13", tax: "15" },
        india: { pop: "1,441,710,000", birth: "16.1", death: "6.6", growth: "0.95", currency: "INR", vat: "18", tax: "10" },
        thailand: { pop: "71,801,000", birth: "10.0", death: "8.0", growth: "0.20", currency: "THB", vat: "7", tax: "10" }
    };
    
    function showData(country) {
        let d = data[country];
        document.getElementById('pop').innerHTML = d.pop;
        document.getElementById('birth').innerHTML = d.birth;
        document.getElementById('death').innerHTML = d.death;
        document.getElementById('growth').innerHTML = d.growth;
        document.getElementById('currency').innerHTML = d.currency;
        document.getElementById('vat').innerHTML = d.vat;
        document.getElementById('tax').innerHTML = d.tax;
    }
    
    function downloadSoftware() {
        alert("📥 JStL Spreadsheet\n\nEmail seliim.ahmed@gmail.com after payment to receive download link.\n\nPrice: $199 USD");
    }
</script>
</body>
</html>
