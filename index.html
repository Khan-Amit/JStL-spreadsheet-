<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Calculator · Simple</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a3b2f;
            font-family: system-ui, -apple-system, 'Segoe UI', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .app {
            max-width: 500px;
            width: 100%;
            background: #0f2d1f;
            border-radius: 1rem;
            padding: 1.8rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid #2d6a4a;
        }
        h1 {
            font-size: 1.5rem;
            color: #d8f3dc;
            margin-bottom: 0.25rem;
        }
        .sub {
            color: #95d5b2;
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #2d6a4a;
            padding-bottom: 0.5rem;
        }
        .country-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .country-btn {
            background: #2d4a3a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            color: #f0f7e6;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s linear;
            font-size: 0.9rem;
        }
        .country-btn.active {
            background: #e9b35f;
            color: #0a2f1a;
            box-shadow: 0 0 0 1px #f9d88c;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            color: #cfe8cf;
            font-weight: 500;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            background: #08261a;
            border: 1px solid #3c7858;
            border-radius: 0.75rem;
            color: #f2ffea;
            font-size: 1.1rem;
            font-weight: 500;
            outline: none;
        }
        input:focus {
            border-color: #e9b35f;
        }
        .result-card {
            background: #092818;
            border-radius: 1rem;
            padding: 1rem;
            margin: 1rem 0;
        }
        .result-line {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #2f6b4a;
        }
        .result-line:last-child {
            border-bottom: none;
        }
        .result-label {
            color: #b8e0b0;
        }
        .result-value {
            color: #ffe6a7;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .net {
            font-size: 1.3rem;
            color: #ffd966;
        }
        button.download {
            width: 100%;
            background: #2a6244;
            border: none;
            padding: 0.7rem;
            border-radius: 2rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
            font-size: 0.9rem;
        }
        button.download:hover {
            background: #e9b35f;
            color: #0f2d1f;
        }
        .note {
            font-size: 0.65rem;
            color: #79a886;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>📊 Income Tax Calculator</h1>
    <div class="sub">Select country · auto calculates</div>

    <div class="country-buttons">
        <button class="country-btn" data-country="Bangladesh">🇧🇩 Bangladesh</button>
        <button class="country-btn" data-country="Canada">🇨🇦 Canada</button>
        <button class="country-btn" data-country="India">🇮🇳 India</button>
        <button class="country-btn" data-country="Thailand">🇹🇭 Thailand</button>
    </div>

    <div class="input-group">
        <label>💰 Annual Income (USD)</label>
        <input type="number" id="income" value="50000" step="1000">
    </div>

    <div class="result-card">
        <div class="result-line">
            <span class="result-label">Country</span>
            <span class="result-value" id="countryDisplay">Bangladesh</span>
        </div>
        <div class="result-line">
            <span class="result-label">Tax Amount</span>
            <span class="result-value" id="taxAmount">$0.00</span>
        </div>
        <div class="result-line">
            <span class="result-label">Net Income (after tax)</span>
            <span class="result-value net" id="netIncome">$0.00</span>
        </div>
    </div>

    <button class="download" id="downloadBtn">⬇️ Download HTML</button>
    <div class="note">✓ Tax rates embedded · No API · Click download to save this page</div>
</div>

<script>
    // ----- EMBEDDED TAX FUNCTIONS (NO API, NO EXCEL) -----
    const taxSystems = {
        Bangladesh: (incomeUSD) => {
            if (incomeUSD <= 0) return 0;
            // progressive brackets (USD equivalent based on BDT 1USD=110BDT)
            let incomeBDT = incomeUSD * 110;
            let taxBDT = 0;
            if (incomeBDT > 350000) {
                if (incomeBDT > 450000) taxBDT += (450000 - 350000) * 0.05;
                else { taxBDT += (incomeBDT - 350000) * 0.05; return taxBDT / 110; }
                if (incomeBDT > 750000) taxBDT += (750000 - 450000) * 0.10;
                else { taxBDT += (incomeBDT - 450000) * 0.10; return taxBDT / 110; }
                if (incomeBDT > 1150000) taxBDT += (1150000 - 750000) * 0.15;
                else { taxBDT += (incomeBDT - 750000) * 0.15; return taxBDT / 110; }
                if (incomeBDT > 1650000) taxBDT += (1650000 - 1150000) * 0.20;
                else { taxBDT += (incomeBDT - 1150000) * 0.20; return taxBDT / 110; }
                taxBDT += (incomeBDT - 1650000) * 0.25;
            }
            return taxBDT / 110;
        },
        Canada: (incomeUSD) => {
            let cad = incomeUSD * 1.35;
            let tax = 0;
            if (cad > 55867) tax += (Math.min(cad, 111733) - 55867) * 0.205;
            if (cad > 111733) tax += (Math.min(cad, 173205) - 111733) * 0.26;
            if (cad > 173205) tax += (Math.min(cad, 246752) - 173205) * 0.29;
            if (cad > 246752) tax += (cad - 246752) * 0.33;
            // add basic provincial 8% avg
            let prov = cad * 0.08;
            return (tax + prov) / 1.35;
        },
        India: (incomeUSD) => {
            let inr = incomeUSD * 83;
            let tax = 0;
            if (inr > 300000) tax += (Math.min(inr, 700000) - 300000) * 0.05;
            if (inr > 700000) tax += (Math.min(inr, 1000000) - 700000) * 0.10;
            if (inr > 1000000) tax += (Math.min(inr, 1200000) - 1000000) * 0.15;
            if (inr > 1200000) tax += (Math.min(inr, 1500000) - 1200000) * 0.20;
            if (inr > 1500000) tax += (inr - 1500000) * 0.30;
            let cess = tax * 0.04;
            return (tax + cess) / 83;
        },
        Thailand: (incomeUSD) => {
            let thb = incomeUSD * 35;
            let tax = 0;
            if (thb > 150000) tax += (Math.min(thb, 300000) - 150000) * 0.05;
            if (thb > 300000) tax += (Math.min(thb, 500000) - 300000) * 0.10;
            if (thb > 500000) tax += (Math.min(thb, 750000) - 500000) * 0.15;
            if (thb > 750000) tax += (Math.min(thb, 1000000) - 750000) * 0.20;
            if (thb > 1000000) tax += (Math.min(thb, 2000000) - 1000000) * 0.25;
            if (thb > 2000000) tax += (Math.min(thb, 5000000) - 2000000) * 0.30;
            if (thb > 5000000) tax += (thb - 5000000) * 0.35;
            return tax / 35;
        }
    };

    let currentCountry = "Bangladesh";

    function updateTax() {
        let income = parseFloat(document.getElementById('income').value);
        if (isNaN(income)) income = 0;
        if (income < 0) income = 0;

        const taxFunc = taxSystems[currentCountry];
        let tax = taxFunc(income);
        if (isNaN(tax)) tax = 0;
        let net = income - tax;

        document.getElementById('countryDisplay').innerText = currentCountry;
        document.getElementById('taxAmount').innerText = `$${tax.toFixed(2)}`;
        document.getElementById('netIncome').innerText = `$${net.toFixed(2)}`;
    }

    // country selector
    const btns = document.querySelectorAll('.country-btn');
    btns.forEach(btn => {
        btn.addEventListener('click', () => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCountry = btn.getAttribute('data-country');
            updateTax();
        });
    });

    document.getElementById('income').addEventListener('input', updateTax);

    // DOWNLOAD BUTTON: saves THIS EXACT PAGE as HTML file (no reset, no front page nonsense)
    document.getElementById('downloadBtn').addEventListener('click', () => {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = `tax_${currentCountry}_${Date.now()}.html`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });

    // set default active
    document.querySelector('.country-btn[data-country="Bangladesh"]').classList.add('active');
    updateTax();
</script>
</body>
</html>
