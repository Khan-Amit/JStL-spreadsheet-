<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JStL - Thailand</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a1a2f; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; background: #0d2b3e; border-radius: 16px; padding: 20px; }
        h1, h2, h3 { color: #7abfef; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { flex: 1; min-width: 280px; background: #0a2a3a; padding: 20px; border-radius: 12px; }
        input, select { width: 100%; padding: 10px; background: #1a3f55; color: white; border: 1px solid #2a5a7a; border-radius: 8px; margin: 8px 0; }
        button { background: #1e5a7a; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin: 10px 0; }
        button:hover { background: #2a6f94; }
        .result { background: #0f2e44; padding: 15px; border-radius: 8px; color: #9fd3ff; font-family: monospace; margin-top: 15px; }
        .footer { text-align: center; color: #6a9ec0; margin-top: 20px; }
        .badge { background: #1e5a7a; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-left: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🇹🇭 JStL Spreadsheet™ - Thailand</h1>
    <div class="grid">
        <div class="card"><h3>💰 Profit <span class="badge">VAT 7%</span></h3>
            <label>Buy Price (THB)</label><input type="number" id="buyPrice" value="1000">
            <label>Sell Price (THB)</label><input type="number" id="sellPrice" value="1500">
            <label>VAT Rate (%)</label><input type="number" id="vatRate" value="7">
            <button id="profitBtn">Calculate</button>
            <div id="profitResult" class="result">Click Calculate</div>
        </div>
        <div class="card"><h3>🧾 Income Tax <span class="badge">Progressive 0-35%</span></h3>
            <label>Annual Income (THB)</label><input type="number" id="income" value="500000">
            <label>Allowances (Personal)</label><input type="number" id="allowances" value="60000">
            <label>Residency</label><select id="residency"><option value="resident">Resident</option><option value="nonresident">Non-Resident (15% Flat)</option></select>
            <button id="taxBtn">Calculate</button>
            <div id="taxResult" class="result">Click Calculate</div>
        </div>
        <div class="card"><h3>🏞️ Land Converter</h3>
            <label>Value</label><input type="number" id="landVal" value="1">
            <label>From</label><select id="fromUnit"><option value="rai">Rai</option><option value="ngan">Ngan</option><option value="wah">Talang Wah</option><option value="sqm">Sq Meter</option></select>
            <label>To</label><select id="toUnit"><option value="sqm">Sq Meter</option><option value="sqft">Sq Ft</option><option value="rai">Rai</option></select>
            <button id="landBtn">Convert</button>
            <div id="landResult" class="result">Click Convert</div>
        </div>
        <div class="card"><h3>👥 Demography</h3>
            <div id="demoResult" class="result">Loading...</div>
            <label>Project Years</label><input type="number" id="projYears" value="5">
            <button id="projBtn">Project</button>
            <div id="projResult" class="result">Click to project</div>
        </div>
    </div>
    <div class="footer">JStL Thailand | Perpetual License | Data: Revenue Dept</div>
</div>
<script>
    function calcProfit() {
        let buy = parseFloat(document.getElementById('buyPrice').value) || 0;
        let sell = parseFloat(document.getElementById('sellPrice').value) || 0;
        let vat = parseFloat(document.getElementById('vatRate').value) || 0;
        let gross = sell - buy;
        let tax = sell * vat / 100;
        let net = gross - tax;
        let margin = sell ? (net / sell) * 100 : 0;
        document.getElementById('profitResult').innerHTML = `Gross Profit: ฿${gross.toFixed(2)}<br>VAT (${vat}%): ฿${tax.toFixed(2)}<br>Net Profit: ฿${net.toFixed(2)}<br>Margin: ${margin.toFixed(2)}%`;
    }
    function calcTax() {
        let income = parseFloat(document.getElementById('income').value) || 0;
        let allowances = parseFloat(document.getElementById('allowances').value) || 0;
        let residency = document.getElementById('residency').value;
        if(residency === 'nonresident') { let tax = income * 0.15; let after = income - tax; let rate = 15; document.getElementById('taxResult').innerHTML = `Taxable: ฿${income.toFixed(2)}<br>Tax (15% flat): ฿${tax.toFixed(2)}<br><strong>Total Tax: ฿${tax.toFixed(2)}</strong><br>After Tax: ฿${after.toFixed(2)}<br>Rate: ${rate}%`; return; }
        let taxable = Math.max(0, income - allowances);
        let slabs = [[0,150000,0],[150000,300000,5],[300000,500000,10],[500000,750000,15],[750000,1000000,20],[1000000,2000000,25],[2000000,5000000,30],[5000000,Infinity,35]];
        let tax = 0, rem = taxable;
        for(let s of slabs) { let amt = Math.min(rem, s[1]-s[0]); if(amt>0) tax += amt * s[2]/100; rem -= amt; if(rem<=0) break; }
        let after = income - tax;
        let rate = income ? (tax/income)*100 : 0;
        document.getElementById('taxResult').innerHTML = `Taxable: ฿${taxable.toFixed(2)}<br>Income Tax: ฿${tax.toFixed(2)}<br><strong>Total Tax: ฿${tax.toFixed(2)}</strong><br>After Tax: ฿${after.toFixed(2)}<br>Rate: ${rate.toFixed(2)}%`;
    }
    function calcLand() {
        let val = parseFloat(document.getElementById('landVal').value) || 0;
        let from = document.getElementById('fromUnit').value;
        let to = document.getElementById('toUnit').value;
        let units = { rai:1600, ngan:400, wah:4, sqm:1 };
        let sqm = val * units[from];
        let result = sqm / units[to];
        document.getElementById('landResult').innerHTML = `${val} ${from} = ${result.toFixed(6)} ${to}<br>📏 ${sqm.toFixed(2)} m² | ${(sqm*10.7639).toFixed(2)} sq ft`;
    }
    let demo = { pop:71800000, year:2024, rate:-0.13 };
    function showDemo() { document.getElementById('demoResult').innerHTML = `Population (${demo.year}): ${demo.pop.toLocaleString()}<br>Growth: ${demo.rate}%`; }
    function calcProj() {
        let years = parseInt(document.getElementById('projYears').value) || 5;
        let pop = demo.pop, rate = demo.rate/100, res = [];
        for(let i=1;i<=years;i++) { pop = pop * (1+rate); res.push(`Year ${demo.year+i}: ${Math.round(pop).toLocaleString()}`); }
        document.getElementById('projResult').innerHTML = res.join('<br>');
    }
    document.getElementById('profitBtn').onclick = calcProfit;
    document.getElementById('taxBtn').onclick = calcTax;
    document.getElementById('landBtn').onclick = calcLand;
    document.getElementById('projBtn').onclick = calcProj;
    calcProfit(); calcTax(); calcLand(); showDemo();
</script>
</body>
</html>
