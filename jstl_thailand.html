<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JStL Spreadsheet™ - Thailand</title>
    <style>
        *{box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0a1a2f;margin:0;padding:20px}
        .container{max-width:1400px;margin:auto;background:#0d2b3e;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,0.3);overflow:hidden}
        .header{background:#071a2b;padding:25px;text-align:center;border-bottom:1px solid #1e4a6e}
        .header h1{margin:0;color:#7abfef;font-size:28px}
        .header p{margin:10px 0 0;color:#6a9ec0}
        .content{padding:20px}
        .grid-2{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:20px}
        .card{flex:1;min-width:280px;background:#0a2a3a;padding:20px;border-radius:12px}
        .card h3{color:#7abfef;margin-top:0;margin-bottom:15px}
        .input-group{margin-bottom:15px}
        .input-group label{display:block;color:#b8e0ff;margin-bottom:5px;font-weight:bold}
        .input-group input,.input-group select{width:100%;background:#1a3f55;color:white;border:1px solid #2a5a7a;padding:10px;border-radius:8px;font-size:14px}
        button{background:#1e5a7a;color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-size:16px;width:100%;margin-top:10px}
        button:hover{background:#2a6f94}
        .result{background:#0f2e44;padding:15px;border-radius:8px;margin-top:15px;color:#9fd3ff;font-family:monospace;font-size:13px;line-height:1.6}
        .badge{display:inline-block;background:#1e5a7a;padding:3px 8px;border-radius:12px;font-size:11px;margin-left:8px}
        .footer{padding:15px;background:#071a2b;text-align:center;color:#6a9ec0;font-size:12px}
        .disclaimer{font-size:11px;color:#6a9ec0;text-align:center;margin-top:15px;padding-top:15px;border-top:1px solid #1e4a6e}
        .save-bar{display:flex;gap:10px;margin-bottom:20px}
        .save-bar button{width:auto;margin:0;padding:10px 20px}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🇹🇭 JStL Spreadsheet™ - Thailand</h1>
        <p>Revenue Department | VAT 7% | Progressive Tax 0-35% | Thai Land Units</p>
    </div>

    <div class="content">
        <div class="save-bar">
            <button id="downloadTxtBtn">📄 Save as .jstl</button>
            <button id="downloadHtmlBtn">🌐 Save as HTML Grid</button>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>💰 Profit Calculator</h3>
                <div class="input-group"><label>Buy Price (THB)</label><input type="number" id="buyPrice" value="1000"></div>
                <div class="input-group"><label>Sell Price (THB)</label><input type="number" id="sellPrice" value="1500"></div>
                <div class="input-group"><label>VAT Rate (%)</label><input type="number" id="vatRate" value="7"></div>
                <button id="calcProfit">⟳ Calculate</button>
                <div id="profitResult" class="result">Click Calculate</div>
            </div>

            <div class="card">
                <h3>🧾 Income Tax Calculator</h3>
                <div class="input-group"><label>Annual Income (THB)</label><input
