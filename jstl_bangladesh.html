<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JStL - Bangladesh</title>
    <style>
        body{font-family:'Segoe UI',sans-serif;background:#0a1a2f;margin:0;padding:20px}
        .container{max-width:1400px;margin:auto;background:#0d2b3e;border-radius:16px;padding:20px}
        h1,h2,h3{color:#7abfef}
        .grid{display:flex;flex-wrap:wrap;gap:20px}
        .card{flex:1;min-width:280px;background:#0a2a3a;padding:20px;border-radius:12px}
        input,select{width:100%;padding:10px;background:#1a3f55;color:#fff;border:1px solid #2a5a7a;border-radius:8px;margin:8px 0}
        button{background:#1e5a7a;color:#fff;padding:12px;border:none;border-radius:8px;cursor:pointer;width:100%;margin:10px 0}
        button:hover{background:#2a6f94}
        .result{background:#0f2e44;padding:15px;border-radius:8px;color:#9fd3ff;font-family:monospace;margin-top:15px}
        .footer{text-align:center;color:#6a9ec0;margin-top:20px}
        .badge{background:#1e5a7a;padding:2px 8px;border-radius:12px;font-size:11px;margin-left:8px}
        .save-bar{display:flex;gap:10px;margin-bottom:20px}
        .save-bar button{width:auto;margin:0;padding:10px 20px}
    </style>
</head>
<body>
<div class="container">
    <div class="save-bar">
        <button id="downloadTxtBtn">📄 Save as .jstl (Text)</button>
        <button id="downloadHtmlBtn">🌐 Save as HTML</button>
    </div>
    <h1>🇧🇩 JStL Spreadsheet™ - Bangladesh</h1>
    <div class="grid">
        <div class="card"><h3>💰 Profit <span class="badge">VAT + Sales Tax</span></h3>
            <label>Buy Price (BDT)</label><input type="number" id="buyPrice" value="500">
            <label>Sell Price (BDT)</label><input type="number" id="sellPrice" value="750">
            <label>VAT Rate (%)</label><input type="number" id="vatRate" value="15">
            <label>Sales Tax Rate (%)</label><input type="number" id="salesTax" value="5">
            <button id="profitBtn">Calculate Profit</button>
            <div id="profitResult" class="result">Click Calculate</div>
        </div>
        <div class="card"><h3>🧾 Income Tax <span class="badge">NBR 2025-26</span></h3>
            <label>Annual Income (BDT)</label><input type="number" id="income" value="500000">
            <label>Taxpayer Category</label>
            <select id="category">
                <option value="general">General</option>
                <option value="women">Women / Senior 65+</option>
                <option value="disabled">Disabled / Third Gender</option>
                <option value="freedom_fighter">Freedom Fighter</option>
            </select>
            <label>Investment (For Rebate)</label><input type="number" id="investment" value="100000">
            <label>Residency</label>
            <select id="residency"><option value="resident">Resident</option><option value="nonresident">Non-Resident (30% Flat)</option></select>
            <button id="taxBtn">Calculate Tax</button>
            <div id="taxResult" class="result">Click Calculate</div>
        </div>
        <div class="card"><h3>🏞️ Land Converter</h3>
            <label>Value</label><input type="number" id="landVal" value="1">
            <label>From</label>
            <select id="fromUnit"><option value="bigha">Bigha</option><option value="katha">Katha</option><option value="decimal">Decimal</option><option value="acre">Acre</option><option value="sqft">Sq Ft</option></select>
            <label>To</label>
            <select id="toUnit"><option value="sqft">Sq Ft</option><option value="acre">Acre</option><option value="bigha">Bigha</option><option value="katha">Katha</option></select>
            <button id="landBtn">Convert</button>
            <div id="landResult" class="result">Click Convert</div>
        </div>
        <div class="card"><h3>👥 Demography</h3>
            <div id="demoResult" class="result">Loading...</div>
            <label>Project Years</label><input type="number" id="projYears" value="5">
            <button id="projBtn">Project Population</button>
            <div id="projResult" class="result">Click to project</div>
        </div>
    </div>
    <div class="footer">JStL Bangladesh | Perpetual License | Data: NBR</div>
</div>
<script>
    // ==================== PROFIT CALCULATOR ====================
    function calcProfit() {
        let buy = parseFloat(document.getElementById('buyPrice').value) || 0;
        let sell = parseFloat(document.getElementById('sellPrice').value) || 0;
        let vatRate = parseFloat(document.getElementById('vatRate').value) || 0;
        let salesTaxRate = parseFloat(document.getElementById('salesTax').value) || 0;
        let gross = sell - buy;
        let vat = sell * vatRate / 100;
        let salesTax = sell * salesTaxRate / 100;
        let net = gross - vat - salesTax;
        let margin = sell ? (net / sell) * 100 : 0;
        document.getElementById('profitResult').innerHTML = `Gross Profit: ${gross.toFixed(2)} BDT<br>VAT (${vatRate}%): ${vat.toFixed(2)} BDT<br>Sales Tax (${salesTaxRate}%): ${salesTax.toFixed(2)} BDT<br>Net Profit: ${net.toFixed(2)} BDT<br>Profit Margin: ${margin.toFixed(2)}%`;
    }

    // ==================== INCOME TAX CALCULATOR ====================
    const taxFreeThresholds = { general:350000, women:400000, disabled:475000, freedom_fighter:500000 };
    const taxSlabs = [
        { min: 0, max: 350000, rate: 0 },
        { min: 350001, max: 450000, rate: 5 },
        { min: 450001, max: 850000, rate: 10 },
        { min: 850001, max: 1350000, rate: 15 },
        { min: 1350001, max: 1850000, rate: 20 },
        { min: 1850001, max: 3850000, rate: 25 },
        { min: 3850001, max: Infinity, rate: 30 }
    ];

    function calcTaxBracket(income) {
        let tax = 0;
        for(let s of taxSlabs) {
            if(income > s.min) {
                let taxable = Math.min(income, s.max) - s.min;
                if(taxable > 0) tax += taxable * s.rate / 100;
            }
        }
        return tax;
    }

    function calcTax() {
        let income = parseFloat(document.getElementById('income').value) || 0;
        let category = document.getElementById('category').value;
        let investment = parseFloat(document.getElementById('investment').value) || 0;
        let residency = document.getElementById('residency').value;

        if(residency === 'nonresident') {
            let tax = income * 30 / 100;
            let after = income - tax;
            document.getElementById('taxResult').innerHTML = `Non-Resident (30% Flat)<br>Income: ${income.toFixed(2)} BDT<br>Tax: ${tax.toFixed(2)} BDT<br>After Tax: ${after.toFixed(2)} BDT<br>Effective Rate: 30%`;
            return;
        }

        let threshold = taxFreeThresholds[category] || 350000;
        let taxable = Math.max(0, income - threshold);
        let tax = calcTaxBracket(taxable);
        
        let maxRebateFromIncome = taxable * 3 / 100;
        let maxRebateFromInvestment = investment * 15 / 100;
        let rebate = Math.min(maxRebateFromIncome, maxRebateFromInvestment, 1000000);
        tax = Math.max(0, tax - rebate);
        tax = Math.max(tax, 5000);
        
        let after = income - tax;
        let rate = income ? (tax/income)*100 : 0;
        document.getElementById('taxResult').innerHTML = `Category: ${category}<br>Tax-Free Threshold: ${threshold.toFixed(2)} BDT<br>Taxable Income: ${taxable.toFixed(2)} BDT<br>Investment Rebate: ${rebate.toFixed(2)} BDT<br><strong>Total Tax: ${tax.toFixed(2)} BDT</strong><br>After Tax: ${after.toFixed(2)} BDT<br>Effective Rate: ${rate.toFixed(2)}%`;
    }

    // ==================== LAND CONVERTER ====================
    const landUnits = { bigha:14400, katha:720, decimal:435.6, acre:43560, sqft:1 };
    function calcLand() {
        let val = parseFloat(document.getElementById('landVal').value) || 0;
        let from = document.getElementById('fromUnit').value;
        let to = document.getElementById('toUnit').value;
        let sqft = val * landUnits[from];
        let result = sqft / landUnits[to];
        document.getElementById('landResult').innerHTML = `${val} ${from} = ${result.toFixed(6)} ${to}<br>📏 ${sqft.toFixed(2)} sq ft`;
    }

    // ==================== DEMOGRAPHY ====================
    let demo = { pop:171186372, year:2024, rate:1.01 };
    function showDemo() { document.getElementById('demoResult').innerHTML = `Population (${demo.year}): ${demo.pop.toLocaleString()}<br>Growth Rate: ${demo.rate}%`; }
    function calcProj() {
        let years = parseInt(document.getElementById('projYears').value) || 5;
        let pop = demo.pop, rate = demo.rate/100, res = [];
        for(let i=1;i<=years;i++) { pop = pop * (1+rate); res.push(`Year ${demo.year+i}: ${Math.round(pop).toLocaleString()}`); }
        document.getElementById('projResult').innerHTML = res.join('<br>');
    }

    // ==================== DOWNLOADS ====================
    function downloadTxt() {
        let content = `JStL Bangladesh Report\nGenerated: ${new Date()}\nIncome: ${document.getElementById('income').value} BDT\nTax: ${document.getElementById('taxResult').innerText}\nLicense: Perpetual`;
        let blob = new Blob([content], {type:"text/plain"});
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `JStL_Bangladesh_${Date.now()}.jstl`;
        link.click();
        alert('✅ Saved as .jstl');
    }
    function downloadHtml() {
        let html = `<!DOCTYPE html><html><head><title>JStL Bangladesh</title><style>body{background:#0a1a2f;color:white}</style></head><body><h1>JStL Bangladesh Report</h1><p>Income: ${document.getElementById('income').value} BDT</p><p>${document.getElementById('taxResult').innerHTML}</p></body></html>`;
        let blob = new Blob([html], {type:"text/html"});
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `JStL_Bangladesh_${Date.now()}.html`;
        link.click();
        alert('✅ Saved as HTML');
    }

    // ==================== EVENT BINDINGS ====================
    document.getElementById('profitBtn').onclick = calcProfit;
    document.getElementById('taxBtn').onclick = calcTax;
    document.getElementById('landBtn').onclick = calcLand;
    document.getElementById('projBtn').onclick = calcProj;
    document.getElementById('downloadTxtBtn').onclick = downloadTxt;
    document.getElementById('downloadHtmlBtn').onclick = downloadHtml;

    // Input listeners for real-time updates
    document.getElementById('buyPrice').oninput = calcProfit;
    document.getElementById('sellPrice').oninput = calcProfit;
    document.getElementById('vatRate').oninput = calcProfit;
    document.getElementById('salesTax').oninput = calcProfit;
    document.getElementById('income').oninput = calcTax;
    document.getElementById('category').onchange = calcTax;
    document.getElementById('investment').oninput = calcTax;
    document.getElementById('residency').onchange = calcTax;
    document.getElementById('landVal').oninput = calcLand;
    document.getElementById('fromUnit').onchange = calcLand;
    document.getElementById('toUnit').onchange = calcLand;

    // Initial calculations
    calcProfit();
    calcTax();
    calcLand();
    showDemo();
</script>
</body>
</html>
