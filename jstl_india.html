<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JStL - India</title>
    <style>
        body{font-family:Arial;background:#0a1a2f;color:white;padding:20px}
        .container{max-width:1200px;margin:auto;background:#0d2b3e;border-radius:16px;padding:20px}
        .grid{display:flex;flex-wrap:wrap;gap:20px}
        .card{flex:1;min-width:250px;background:#0a2a3a;padding:20px;border-radius:12px}
        input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
        button{background:#1e5a7a;color:white;padding:12px;border:none;border-radius:8px;cursor:pointer;width:100%}
        button:hover{background:#2a6f94}
        .result{background:#0f2e44;padding:10px;border-radius:8px;margin-top:10px;font-family:monospace}
        h3{color:#7abfef}
    </style>
</head>
<body>
<div class="container">
    <h1>🇮🇳 JStL India</h1>
    <div class="grid">
        
        <div class="card">
            <h3>💰 Profit (GST)</h3>
            <input type="number" id="buy" placeholder="Buy Price" value="5000">
            <input type="number" id="sell" placeholder="Sell Price" value="8000">
            <select id="gstRate">
                <option value="5">5% GST</option>
                <option value="12">12% GST</option>
                <option value="18" selected>18% GST</option>
                <option value="28">28% GST</option>
            </select>
            <button onclick="calcProfit()">Calculate</button>
            <div id="profitResult" class="result">Result here</div>
        </div>

        <div class="card">
            <h3>🧾 Income Tax</h3>
            <input type="number" id="income" placeholder="Annual Income" value="1000000">
            <select id="regime">
                <option value="new">New Regime</option>
                <option value="old">Old Regime</option>
            </select>
            <input type="number" id="deductions" placeholder="Deductions (80C etc.)" value="150000">
            <button onclick="calcTax()">Calculate</button>
            <div id="taxResult" class="result">Result here</div>
        </div>

        <div class="card">
            <h3>🏞️ Land</h3>
            <input type="number" id="landVal" placeholder="Value" value="1">
            <select id="fromUnit">
                <option value="bigha">Bigha</option>
                <option value="gaj">Gaj</option>
                <option value="acre">Acre</option>
            </select>
            <span> to </span>
            <select id="toUnit">
                <option value="sqft">Square Feet</option>
                <option value="gaj">Gaj</option>
            </select>
            <button onclick="calcLand()">Convert</button>
            <div id="landResult" class="result">Result here</div>
        </div>
    </div>
    <div style="margin-top:20px;font-size:12px;color:#6a9ec0">JStL Spreadsheet™ - India | Perpetual License</div>
</div>

<script>
    function calcProfit() {
        let buy = parseFloat(document.getElementById('buy').value) || 0;
        let sell = parseFloat(document.getElementById('sell').value) || 0;
        let gst = parseFloat(document.getElementById('gstRate').value) || 0;
        let gross = sell - buy;
        let gstAmt = sell * gst / 100;
        let net = gross - gstAmt;
        let margin = sell ? (net / sell) * 100 : 0;
        document.getElementById('profitResult').innerHTML = `
            Gross: ₹${gross.toFixed(2)}<br>
            GST (${gst}%): ₹${gstAmt.toFixed(2)}<br>
            Net Profit: ₹${net.toFixed(2)}<br>
            Margin: ${margin.toFixed(2)}%
        `;
    }

    function calcTax() {
        let income = parseFloat(document.getElementById('income').value) || 0;
        let regime = document.getElementById('regime').value;
        let deductions = parseFloat(document.getElementById('deductions').value) || 0;
        
        let taxable = income;
        if (regime === 'old') taxable = Math.max(0, income - deductions);
        
        let tax = 0;
        if (regime === 'new') {
            if (taxable > 300000) tax += (Math.min(taxable, 700000) - 300000) * 0.05;
            if (taxable > 700000) tax += (Math.min(taxable, 1000000) - 700000) * 0.10;
            if (taxable > 1000000) tax += (Math.min(taxable, 1200000) - 1000000) * 0.12;
            if (taxable > 1200000) tax += (Math.min(taxable, 1500000) - 1200000) * 0.15;
            if (taxable > 1500000) tax += (taxable - 1500000) * 0.30;
        } else {
            if (taxable > 250000) tax += (Math.min(taxable, 500000) - 250000) * 0.05;
            if (taxable > 500000) tax += (Math.min(taxable, 1000000) - 500000) * 0.20;
            if (taxable > 1000000) tax += (taxable - 1000000) * 0.30;
        }
        
        let cess = tax * 0.04;
        let total = tax + cess;
        let after = income - total;
        let rate = income ? (total / income * 100) : 0;
        
        document.getElementById('taxResult').innerHTML = `
            Taxable: ₹${taxable.toFixed(2)}<br>
            Income Tax: ₹${tax.toFixed(2)}<br>
            Cess (4%): ₹${cess.toFixed(2)}<br>
            <strong>Total Tax: ₹${total.toFixed(2)}</strong><br>
            After Tax: ₹${after.toFixed(2)}<br>
            Rate: ${rate.toFixed(2)}%
        `;
    }

    function calcLand() {
        let val = parseFloat(document.getElementById('landVal').value) || 0;
        let from = document.getElementById('fromUnit').value;
        let to = document.getElementById('toUnit').value;
        
        let sqft = 0;
        if (from === 'bigha') sqft = val * 27225;
        else if (from === 'gaj') sqft = val * 9;
        else if (from === 'acre') sqft = val * 43560;
        
        let result = 0;
        if (to === 'sqft') result = sqft;
        else if (to === 'gaj') result = sqft / 9;
        
        document.getElementById('landResult').innerHTML = `${val} ${from} = ${result.toFixed(2)} ${to}`;
    }
</script>
</body>
</html>
