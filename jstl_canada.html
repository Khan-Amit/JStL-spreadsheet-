<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JStL - Canada</title>
    <style>
        body{font-family:Arial;background:#0a1a2f;color:white;padding:20px}
        .container{max-width:1200px;margin:auto;background:#0d2b3e;border-radius:16px;padding:20px}
        .grid{display:flex;flex-wrap:wrap;gap:20px}
        .card{flex:1;min-width:250px;background:#0a2a3a;padding:20px;border-radius:12px}
        input,select{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
        button{background:#1e5a7a;color:white;padding:12px;border:none;border-radius:8px;cursor:pointer;width:100%}
        button:hover{background:#2a6f94}
        .result{background:#0f2e44;padding:10px;border-radius:8px;margin-top:10px;font-family:monospace}
        h3{color:#7abfef}
    </style>
</head>
<body>
<div class="container">
    <h1>🇨🇦 JStL Canada</h1>
    <div class="grid">
        
        <!-- Profit Calculator -->
        <div class="card">
            <h3>💰 Profit</h3>
            <input type="number" id="buy" placeholder="Buy Price" value="100">
            <input type="number" id="sell" placeholder="Sell Price" value="180">
            <select id="provinceTax">
                <option value="5">Alberta (5% GST)</option>
                <option value="13">Ontario (13% HST)</option>
                <option value="12">BC (5% GST + 7% PST)</option>
            </select>
            <button onclick="calcProfit()">Calculate</button>
            <div id="profitResult" class="result">Result here</div>
        </div>

        <!-- Tax Calculator -->
        <div class="card">
            <h3>🧾 Income Tax</h3>
            <input type="number" id="income" placeholder="Annual Income" value="60000">
            <select id="provinceIncome">
                <option value="AB">Alberta</option>
                <option value="ON">Ontario</option>
                <option value="BC">BC</option>
            </select>
            <button onclick="calcTax()">Calculate</button>
            <div id="taxResult" class="result">Result here</div>
        </div>

        <!-- Land Converter -->
        <div class="card">
            <h3>🏞️ Land</h3>
            <input type="number" id="landVal" placeholder="Value" value="1">
            <select id="fromUnit">
                <option value="acre">Acre</option>
                <option value="hectare">Hectare</option>
            </select>
            <span> to </span>
            <select id="toUnit">
                <option value="sqft">Square Feet</option>
                <option value="sqm">Square Meters</option>
            </select>
            <button onclick="calcLand()">Convert</button>
            <div id="landResult" class="result">Result here</div>
        </div>
    </div>
    <div style="margin-top:20px;font-size:12px;color:#6a9ec0">JStL Spreadsheet™ - Canada | Perpetual License</div>
</div>

<script>
    function calcProfit() {
        let buy = parseFloat(document.getElementById('buy').value) || 0;
        let sell = parseFloat(document.getElementById('sell').value) || 0;
        let taxRate = parseFloat(document.getElementById('provinceTax').value) || 0;
        let gross = sell - buy;
        let tax = sell * taxRate / 100;
        let net = gross - tax;
        let margin = sell ? (net / sell) * 100 : 0;
        document.getElementById('profitResult').innerHTML = `
            Gross: $${gross.toFixed(2)}<br>
            Tax (${taxRate}%): $${tax.toFixed(2)}<br>
            Net Profit: $${net.toFixed(2)}<br>
            Margin: ${margin.toFixed(2)}%
        `;
    }

    function calcTax() {
        let income = parseFloat(document.getElementById('income').value) || 0;
        let prov = document.getElementById('provinceIncome').value;
        
        let federal = 0;
        if (income > 57375) federal += (Math.min(income, 114750) - 57375) * 0.205;
        if (income > 114750) federal += (Math.min(income, 177882) - 114750) * 0.26;
        if (income > 177882) federal += (Math.min(income, 253414) - 177882) * 0.29;
        if (income > 253414) federal += (income - 253414) * 0.33;
        
        let provincial = 0;
        if (prov === 'AB') {
            if (income > 148000) provincial += (income - 148000) * 0.12;
        } else if (prov === 'ON') {
            if (income > 51446) provincial += (Math.min(income, 102894) - 51446) * 0.0915;
            if (income > 102894) provincial += (income - 102894) * 0.1116;
        } else if (prov === 'BC') {
            if (income > 47037) provincial += (income - 47037) * 0.077;
        }
        
        let total = federal + provincial;
        let after = income - total;
        let rate = income ? (total / income * 100) : 0;
        
        document.getElementById('taxResult').innerHTML = `
            Federal Tax: $${federal.toFixed(2)}<br>
            Provincial Tax: $${provincial.toFixed(2)}<br>
            <strong>Total Tax: $${total.toFixed(2)}</strong><br>
            After Tax: $${after.toFixed(2)}<br>
            Rate: ${rate.toFixed(2)}%
        `;
    }

    function calcLand() {
        let val = parseFloat(document.getElementById('landVal').value) || 0;
        let from = document.getElementById('fromUnit').value;
        let to = document.getElementById('toUnit').value;
        
        let sqft = 0;
        if (from === 'acre') sqft = val * 43560;
        else if (from === 'hectare') sqft = val * 107639;
        
        let result = 0;
        if (to === 'sqft') result = sqft;
        else if (to === 'sqm') result = sqft / 10.764;
        
        document.getElementById('landResult').innerHTML = `${val} ${from} = ${result.toFixed(2)} ${to}`;
    }
</script>
</body>
</html>
