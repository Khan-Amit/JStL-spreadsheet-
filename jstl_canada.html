<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JStL Canada</title>
    <style>
        *{box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0a1a2f;margin:0;padding:20px}
        .container{max-width:1400px;margin:auto;background:#0d2b3e;border-radius:16px;padding:20px}
        h1,h3{color:#7abfef}
        .grid{display:flex;flex-wrap:wrap;gap:20px}
        .card{flex:1;min-width:280px;background:#0a2a3a;padding:20px;border-radius:12px}
        input,select{width:100%;padding:10px;background:#1a3f55;color:#fff;border:1px solid #2a5a7a;border-radius:8px;margin:8px 0}
        button{background:#1e5a7a;color:#fff;padding:12px;border:none;border-radius:8px;cursor:pointer;width:100%;margin:10px 0}
        button:hover{background:#2a6f94}
        .result{background:#0f2e44;padding:15px;border-radius:8px;color:#9fd3ff;font-family:monospace;margin-top:15px}
        .save-bar{display:flex;gap:10px;margin-bottom:20px}
        .save-bar button{width:auto;margin:0;padding:10px 20px}
        .footer{text-align:center;color:#6a9ec0;margin-top:20px}
        .badge{background:#1e5a7a;padding:2px 8px;border-radius:12px;font-size:11px;margin-left:8px}
    </style>
</head>
<body>
<div class="container">
    <h1>🇨🇦 JStL Spreadsheet™ - Canada</h1>
    <div class="save-bar">
        <button id="downloadTxtBtn">📄 Save as .jstl (Text Grid)</button>
        <button id="downloadHtmlBtn">🌐 Save as HTML Grid</button>
    </div>
    <div class="grid">
        <div class="card"><h3>💰 Profit <span class="badge">GST/HST</span></h3>
            <label>Buy Price (CAD)</label><input type="number" id="buyPrice" value="100">
            <label>Sell Price (CAD)</label><input type="number" id="sellPrice" value="180">
            <label>Province</label>
            <select id="province"><option value="5">Alberta (5% GST)</option><option value="12">BC (5% GST + 7% PST)</option><option value="13">Ontario (13% HST)</option></select>
            <button id="calcProfit">Calculate</button>
            <div id="profitResult" class="result">Click Calculate</div>
        </div>
        <div class="card"><h3>🧾 Income Tax <span class="badge">Federal + Provincial</span></h3>
            <label>Annual Income (CAD)</label><input type="number" id="income" value="60000">
            <label>Province</label>
            <select id="taxProvince"><option value="AB">Alberta</option><option value="BC">BC</option><option value="ON">Ontario</option></select>
            <label>RRSP</label><input type="number" id="rrsp" value="0">
            <button id="calcTax">Calculate</button>
            <div id="taxResult" class="result">Click Calculate</div>
        </div>
        <div class="card"><h3>🏞️ Land Converter</h3>
            <label>Value</label><input type="number" id="landVal" value="1">
            <label>From</label><select id="fromUnit"><option value="acre">Acre</option><option value="hectare">Hectare</option><option value="sqft">Sq Ft</option></select>
            <label>To</label><select id="toUnit"><option value="sqft">Sq Ft</option><option value="acre">Acre</option><option value="hectare">Hectare</option></select>
            <button id="calcLand">Convert</button>
            <div id="landResult" class="result">Click Convert</div>
        </div>
        <div class="card"><h3>👥 Demography</h3>
            <div id="demoResult" class="result">Loading...</div>
            <label>Project Years</label><input type="number" id="projYears" value="5">
            <button id="calcProj">Project</button>
            <div id="projResult" class="result">Click to project</div>
        </div>
    </div>
    <div class="footer">JStL Canada | Perpetual License | Data: CRA</div>
</div>
<script>
    const demo = { pop:41575585, year:2025, rate:-0.2, male:49.5, female:50.5 };
    const land = { acre:43560, hectare:107639, sqft:1 };
    const fed = [[0,57375,15],[57375,114750,20.5],[114750,177882,26],[177882,253414,29],[253414,Infinity,33]];
    const provTax = { AB:[[0,148000,10],[148000,Infinity,12]], BC:[[0,47037,5.06],[47037,Infinity,7.7]], ON:[[0,51446,5.05],[51446,Infinity,9.15]] };
    
    function calcProfit() {
        let buy = parseFloat(document.getElementById('buyPrice').value) || 0;
        let sell = parseFloat(document.getElementById('sellPrice').value) || 0;
        let rate = parseFloat(document.getElementById('province').value) || 0;
        let gross = sell - buy;
        let tax = sell * rate / 100;
        let net = gross - tax;
        let margin = sell ? (net/sell)*100 : 0;
        document.getElementById('profitResult').innerHTML = `Gross: $${gross.toFixed(2)}<br>Tax (${rate}%): $${tax.toFixed(2)}<br>Net: $${net.toFixed(2)}<br>Margin: ${margin.toFixed(2)}%`;
    }
    function calcBracket(inc, b) { let tax=0, r=inc; for(let x of b) { let a = Math.min(r, x[1]-x[0]); if(a>0) tax += a * x[2]/100; r -= a; if(r<=0) break; } return tax; }
    function calcTax() {
        let inc = parseFloat(document.getElementById('income').value) || 0;
        let rrsp = parseFloat(document.getElementById('rrsp').value) || 0;
        let prov = document.getElementById('taxProvince').value;
        let taxable = Math.max(0, inc - rrsp);
        let federal = calcBracket(taxable, fed);
        let provincial = calcBracket(taxable, provTax[prov]);
        let total = federal + provincial;
        document.getElementById('taxResult').innerHTML = `Taxable: $${taxable.toFixed(2)}<br>Federal: $${federal.toFixed(2)}<br>Provincial: $${provincial.toFixed(2)}<br><strong>Total Tax: $${total.toFixed(2)}</strong><br>After Tax: $${(inc-total).toFixed(2)}<br>Rate: ${inc?((total/inc)*100).toFixed(2):0}%`;
    }
    function calcLand() {
        let v = parseFloat(document.getElementById('landVal').value) || 0;
        let f = document.getElementById('fromUnit').value;
        let t = document.getElementById('toUnit').value;
        let sqft = v * land[f];
        let r = sqft / land[t];
        document.getElementById('landResult').innerHTML = `${v} ${f} = ${r.toFixed(6)} ${t}<br>📏 ${sqft.toFixed(2)} sq ft`;
    }
    function showDemo() { document.getElementById('demoResult').innerHTML = `Population: ${demo.pop.toLocaleString()}<br>Male: ${demo.male}% | Female: ${demo.female}%<br>Growth: ${demo.rate}%`; }
    function calcProj() {
        let y = parseInt(document.getElementById('projYears').value) || 5, p = demo.pop, r = demo.rate/100, res = [];
        for(let i=1;i<=y;i++) { p = p * (1+r); res.push(`Year ${demo.year+i}: ${Math.round(p).toLocaleString()}`); }
        document.getElementById('projResult').innerHTML = res.join('<br>');
    }
    function downloadTxt() {
        let inc = document.getElementById('income').value;
        let taxText = document.getElementById('taxResult').innerText.replace(/\n/g, ' ');
        let content = `+------------------------------------------------------------------------------+
| JStL Canada Report                                                         |
| Generated: ${new Date().toLocaleString()}                                   |
+--------------------------------+------------------------------+------------+
| CATEGORY                       | ITEM                         | VALUE      |
+--------------------------------+------------------------------+------------+
| INPUTS                         | Annual Income                | $${inc}     |
+--------------------------------+------------------------------+------------+
| RESULTS                        | ${taxText.substring(0, 50)}  |            |
+------------------------------------------------------------------------------+
| JStL Spreadsheet™ — Perpetual License                                       |
| 📧 amit.khanna.1082@gmail.com | seliim.ahmed@gmail.com                    |
+------------------------------------------------------------------------------+`;
        let blob = new Blob([content], {type:"text/plain;charset=utf-8"});
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `JStL_Canada_${Date.now()}.jstl`;
        link.click();
        alert('✅ Saved');
    }
    function downloadHtml() {
        let inc = document.getElementById('income').value;
        let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JStL Canada</title><style>body{background:#0a1a2f;color:white}</style></head><body><h1>JStL Canada</h1><p>Income: $${inc}</p><p>Population: ${demo.pop.toLocaleString()}</p><p>Male: ${demo.male}% | Female: ${demo.female}%</p></body></html>`;
        let blob = new Blob([html], {type:"text/html;charset=utf-8"});
        let link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `JStL_Canada_${Date.now()}.html`;
        link.click();
        alert('✅ Saved');
    }
    document.getElementById('calcProfit').onclick = calcProfit;
    document.getElementById('calcTax').onclick = calcTax;
    document.getElementById('calcLand').onclick = calcLand;
    document.getElementById('calcProj').onclick = calcProj;
    document.getElementById('downloadTxtBtn').onclick = downloadTxt;
    document.getElementById('downloadHtmlBtn').onclick = downloadHtml;
    document.getElementById('buyPrice').oninput = calcProfit;
    document.getElementById('sellPrice').oninput = calcProfit;
    document.getElementById('province').onchange = calcProfit;
    document.getElementById('income').oninput = calcTax;
    document.getElementById('taxProvince').onchange = calcTax;
    document.getElementById('rrsp').oninput = calcTax;
    document.getElementById('landVal').oninput = calcLand;
    document.getElementById('fromUnit').onchange = calcLand;
    document.getElementById('toUnit').onchange = calcLand;
    calcProfit(); calcTax(); calcLand(); showDemo();
</script>
</body>
</html>
